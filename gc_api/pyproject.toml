[project]
name = "gc_core"
version = "0.1.0"
description = "Protopype implementation from the Green Cloud project at the AI group at Blekinge Institute of Technology."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "darts[torch]>=0.43.0",
    "fastapi[standard]>=0.128.0",
    "mapie>=1.3.0",
    "matplotlib>=3.10.8",
    "optuna>=4.8.0",
    "pandas>=3.0.0",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.46",
    "statsforecast>=2.0.3",
    "statsmodels>=0.14.6",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
disable_error_code = ["import-untyped"]
